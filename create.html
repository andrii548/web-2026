<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Додати ялинку — Ялинковий світ</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">Ялинковий світ</a>
    <nav class="tabs">
      <a class="tab" href="index.html">Мої ялинки</a>
      <a class="tab active" href="create.html">Додати ялинку</a>
    </nav>
  </header>

  <main class="form-page">
    <h1>Додати ялинку</h1>

    <form id="tree-form" class="form" data-mode="create" novalidate autocomplete="off">
      <div class="field">
        <label for="manufacturer">Назва виробника</label>
        <input type="text" id="manufacturer" name="manufacturer" data-label="Назва виробника"
               placeholder="Наприклад, Triumph Tree"
               required minlength="2" maxlength="50"
               pattern="[A-Za-zА-Яа-яІіЇїЄєҐґ0-9 .,'&amp;\-]+"
               title="дозволені літери, цифри, пробіл та символи . , ' &amp; -">
      </div>

      <div class="field">
        <label for="height">Висота (см)</label>
        <input type="number" id="height" name="height" data-label="Висота"
               placeholder="180" required min="20" max="500" step="1">
      </div>

      <div class="field">
        <label for="price">Ціна (грн)</label>
        <input type="number" id="price" name="price" data-label="Ціна"
               placeholder="3450" required min="1" max="1000000" step="0.01">
      </div>

      <div class="field">
        <label for="material">Матеріал виробництва</label>
        <select id="material" name="material" data-label="Матеріал виробництва" required>
          <option value="">Оберіть матеріал</option>
        </select>
      </div>

      <div class="field">
        <label for="image">Посилання на зображення (необов'язково)</label>
        <input type="url" id="image" name="image" data-label="Зображення"
               placeholder="https://example.com/tree.jpg">
        <p class="hint">Якщо залишити порожнім, буде стандартне зображення.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Додати</button>
    </form>
  </main>

  <script src="js/tree.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
