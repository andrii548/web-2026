<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мої ялинки</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="shortcut icon" href="img/default-tree.svg" type="image/x-icon">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">Ялинковий світ</a>
    <nav class="tabs">
      <a class="tab active" href="index.html">Мої ялинки</a>
      <a class="tab" href="create.html">Додати ялинку</a>
    </nav>

    <form class="search" id="search-form" autocomplete="off">
      <input type="text" id="search-input" placeholder="Пошук за виробником…" aria-label="Пошук за назвою виробника">
      <button type="submit" class="btn btn-outline-primary">Пошук</button>
      <button type="button" class="btn btn-outline-danger" id="clear-btn">Скинути</button>
    </form>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h1>Керування ялинками</h1>

      <label class="switch-row" for="sort-toggle">
        <span>Сортувати за ціною (спочатку найдорожчі)</span>
        <span class="switch">
          <input type="checkbox" id="sort-toggle">
          <span class="slider"></span>
        </span>
      </label>

      <hr>

      <p class="sidebar-label">Підрахувати загальну вартість:</p>
      <button type="button" class="btn btn-primary btn-block" id="count-btn">Підрахувати</button>
      <p class="total-row">Загальна вартість: <strong id="total">—</strong></p>
    </aside>

    <section class="content">
      <div class="cards" id="tree-list"></div>
    </section>
  </main>

  <script src="js/tree.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/view.js"></script>
</body>
</html>
